redis-cluster:
  enabled: false
redis:
  enabled: true
postgresql:
  enabled: false
postgresql-ha:
  enabled: false

# Enable MySQL as external database for production
mysql:
  enabled: true
  auth:
    rootPassword: "gitea-root-password"
    database: "gitea"
    username: "gitea"
    password: "gitea-password"

# Enable persistent storage for repository data
persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""

gitea:
  config:
    database:
      DB_TYPE: mysql
      HOST: gitea-mysql:3306
      NAME: gitea
      USER: gitea
      PASSWD: gitea-password
    session:
      PROVIDER: db
    cache:
      ADAPTER: redis
      HOST: redis://gitea-redis:6379/0
    queue:
      TYPE: redis
      CONN_STR: redis://gitea-redis:6379/0